<!--
  Template "checklist": the ask, as a short list of decisions with amounts. See slides/decision.html and H.decision
  in src/js/hooks-money.js for the ticking and the live totals.
  Use: node tools/new-slide.mjs <id> checklist
-->
<section class="slide" id="new-slide" data-title="Ready for approval" data-steps="0">
  <div class="in">
    <div class="hd">
      <p class="eyebrow"><span class="ch">00</span> Chapter</p>
      <h2 class="t">Ready for approval.</h2>
    </div>
    <div class="card raised ap-box fill no-swipe">
      <span class="tag m1">Decisions for today</span>
      <label class="ap-row"><input type="checkbox" checked><i class="ck"></i><span class="ap-what"><b>The first decision</b><small>what it covers</small></span><span class="ap-amt"><b data-bind="key"></b><small>once</small></span></label>
      <label class="ap-row"><input type="checkbox" checked><i class="ck"></i><span class="ap-what"><b>The second decision</b><small>what it covers</small></span><span class="ap-amt"><b class="ap-words">no new cost</b></span></label>
      <div class="ap-total"><span class="tag">Total requested</span><b data-bind="key"></b></div>
    </div>
  </div>
  <p class="src">Where the amounts come from.</p><span class="pg"></span>
  <aside class="notes"><h4>The ask</h4><p>Name each decision and its amount. Every figure here has already been on an earlier slide.</p></aside>
</section>
